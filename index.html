<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Akmaz — client data stops at the desk</title>
  <meta name="description" content="Most leaks are not hackers — they are staff being helpful. Akmaz clears card numbers, IBANs, PPSNs and passwords from the clipboard before they can be pasted. Endpoint DLP for small businesses. Built in Ireland, hosted in the EU." />
  <link rel="canonical" href="https://akmaz.eu/" />

  <!-- Open Graph. The image is referenced but not shipped yet: a broken og:image
       renders as an empty grey card on LinkedIn, which looks worse than none at all,
       so generate og.png (1200×630) before sharing any link publicly. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://akmaz.eu/" />
  <meta property="og:title" content="Akmaz — client data stops at the desk" />
  <meta property="og:description" content="It won't be a hacker. It'll be someone helpful. Endpoint data-loss prevention for small businesses in Ireland." />
  <meta property="og:image" content="https://akmaz.eu/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Akmaz" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Akmaz — client data stops at the desk" />
  <meta name="twitter:description" content="It won't be a hacker. It'll be someone helpful." />
  <meta name="twitter:image" content="https://akmaz.eu/og.png" />

  <meta name="theme-color" content="#f7f8f9" />
  <meta name="color-scheme" content="light" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- Fonts are self-hosted, not loaded from Google.
       Requesting a webfont sends the visitor's IP address to Google in the United
       States before they have interacted with anything. A German court (LG München,
       2022) held that this alone breaches GDPR, and the reasoning applies to any site
       in the EU. For a product whose whole argument is "your data stays in the EU", a
       font request that leaks visitor IPs to a US company on the landing page is the
       kind of inconsistency a technical buyer notices in the network tab.
       There is also no cookie banner here because there are no cookies to consent to —
       CNIL fined SHEIN €150m in 2025 for advertising cookies set before consent, and
       the cheapest way to pass that test is to have nothing to ask about. -->
  <!-- Preload the Latin cut only. The others are declared with unicode-range and
       fetched on demand, so an English reader never downloads Cyrillic. -->
  <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Akmaz",
    "applicationCategory": "SecurityApplication",
    "operatingSystem": "Windows",
    "description": "Endpoint data-loss prevention for small businesses. Blocks sensitive data at the clipboard, browser, files and removable media.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR", "description": "14-day free trial" }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- A single-page React app is a blank page without JS. Search crawlers execute it,
       but a reader with scripts blocked deserves the one sentence that matters and a
       way to reach the product. -->
  <noscript>
    <div style="max-width:34rem;margin:12vh auto;padding:0 1.5rem;font:400 1rem/1.6 system-ui,sans-serif;color:#0c0e12;background:#f7f8f9">
      <h1 style="font-size:1.6rem;letter-spacing:-.02em">Akmaz</h1>
      <p style="color:#5a6472">Endpoint data-loss prevention for small businesses. This page needs JavaScript for the animated walkthrough — the product itself does not.</p>
      <p style="margin-top:1.5rem"><a href="https://app.akmaz.eu/signup" style="color:#d92d20">Start the free trial &rarr;</a></p>
    </div>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
